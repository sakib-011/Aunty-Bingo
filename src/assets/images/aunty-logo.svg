<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B5E"/>
      <stop offset="100%" stop-color="#6854C7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="120" cy="120" r="110" fill="url(#bgGrad)" filter="url(#softShadow)"/>
  <circle cx="120" cy="120" r="102" fill="none" stroke="#FFF9F0" stroke-width="3" stroke-dasharray="6,4" opacity="0.8"/>

  <!-- Aunty Hair Bun -->
  <circle cx="120" cy="80" r="52" fill="#292735"/>
  <circle cx="120" cy="50" r="28" fill="#1E1B29"/>
  <!-- Hair Bun Flower (Gajra / Bel Phool) -->
  <circle cx="95" cy="54" r="8" fill="#FFF9F0"/>
  <circle cx="110" cy="42" r="8" fill="#FFF9F0"/>
  <circle cx="130" cy="42" r="8" fill="#FFF9F0"/>
  <circle cx="145" cy="54" r="8" fill="#FFF9F0"/>
  <circle cx="120" cy="46" r="5" fill="#FFD166"/>

  <!-- Face -->
  <path d="M78 95 C78 150 162 150 162 95 C162 72 78 72 78 95 Z" fill="#FAD4B2"/>

  <!-- Ears & Earrings (Jhumka) -->
  <circle cx="75" cy="100" r="8" fill="#FAD4B2"/>
  <circle cx="165" cy="100" r="8" fill="#FAD4B2"/>
  <!-- Gold Jhumkas -->
  <path d="M74 106 L70 120 L78 120 Z" fill="url(#goldGrad)"/>
  <circle cx="74" cy="122" r="3" fill="#FFD166"/>
  <path d="M166 106 L162 120 L170 120 Z" fill="url(#goldGrad)"/>
  <circle cx="166" cy="122" r="3" fill="#FFD166"/>

  <!-- Hair Forehead parting & bang -->
  <path d="M78 90 Q120 70 162 90 Q120 58 78 90 Z" fill="#292735"/>

  <!-- Big Red Bindi -->
  <circle cx="120" cy="90" r="5.5" fill="#D32F2F"/>
  <circle cx="120" cy="90" r="2" fill="#FFCDD2" opacity="0.6"/>

  <!-- Cat-Eye Spectacles (Signature Aunty Look) -->
  <!-- Left frame -->
  <path d="M85 96 C85 88 112 88 112 99 C112 110 85 110 85 96 Z" fill="#FFFFFF" fill-opacity="0.3" stroke="#C2185B" stroke-width="3.5"/>
  <path d="M85 92 Q81 88 77 92" stroke="#C2185B" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Right frame -->
  <path d="M128 99 C128 88 155 88 155 96 C155 110 128 110 128 99 Z" fill="#FFFFFF" fill-opacity="0.3" stroke="#C2185B" stroke-width="3.5"/>
  <path d="M155 92 Q159 88 163 92" stroke="#C2185B" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Bridge -->
  <path d="M112 97 Q120 94 128 97" fill="none" stroke="#C2185B" stroke-width="3.5"/>

  <!-- Eyes behind specs -->
  <circle cx="98" cy="98" r="4" fill="#292735"/>
  <circle cx="142" cy="98" r="4" fill="#292735"/>
  <circle cx="100" cy="96" r="1.5" fill="#FFF"/>
  <circle cx="144" cy="96" r="1.5" fill="#FFF"/>
  <!-- Eyebrows -->
  <path d="M88 88 Q98 84 108 88" stroke="#292735" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M132 88 Q142 84 152 88" stroke="#292735" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Nose & Nose Pin (Noth) -->
  <path d="M117 104 Q120 112 124 112" stroke="#D78D63" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <circle cx="114" cy="109" r="2" fill="url(#goldGrad)"/>

  <!-- Cheerful / Knowing Smile -->
  <path d="M106 122 Q120 134 134 122" stroke="#C2185B" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Cheeks Blush -->
  <ellipse cx="88" cy="112" rx="7" ry="4" fill="#FF8A80" opacity="0.4"/>
  <ellipse cx="152" cy="112" rx="7" ry="4" fill="#FF8A80" opacity="0.4"/>

  <!-- Sari Neckline & Pallu drape -->
  <path d="M60 170 C75 140 100 138 120 144 C140 138 165 140 180 170 C160 210 80 210 60 170 Z" fill="#D81B60"/>
  <!-- Gold Border (Aachol / Zari) -->
  <path d="M72 152 Q120 144 168 152" stroke="url(#goldGrad)" stroke-width="5" fill="none"/>
  <!-- Sari Pallu diagonally across chest -->
  <path d="M70 148 L145 210 L168 210 L102 144 Z" fill="#AD1457"/>
  <path d="M70 148 L145 210" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- Gold Necklace -->
  <path d="M96 142 Q120 156 144 142" stroke="url(#goldGrad)" stroke-width="3" fill="none"/>
  <circle cx="120" cy="151" r="3.5" fill="url(#goldGrad)"/>

  <!-- Floating Star Badge / B-I-N-G-O mini balls -->
  <g transform="translate(160, 25)">
    <circle cx="16" cy="16" r="20" fill="#FFD166" stroke="#FFFFFF" stroke-width="3"/>
    <text x="16" y="22" font-family="'Poppins', sans-serif" font-weight="900" font-size="16" fill="#6854C7" text-anchor="middle">B</text>
  </g>
</svg>
